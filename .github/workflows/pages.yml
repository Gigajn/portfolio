name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Memastikan server Rust (untuk mode lokal) tetap bisa dikompilasi.
      - name: Cek kompilasi server Rust
        run: cargo build --release --locked

      # Situs portofolio sendiri bersifat statis (HTML + projects.json),
      # jadi yang dipublikasikan hanya berkas yang dipakai halaman.
      - name: Siapkan berkas situs statis
        run: |
          mkdir -p _site
          cp public/index.html public/projects.json _site/
          cp public/hero_nature.jpg public/nature_alpine.jpg public/nature_canyon.jpg _site/
          cp -r public/screenshots _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
